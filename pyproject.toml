[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "yroots"
version = "0.1.0"
description = "Numerical rootfinding for multivariate systems of equations"
license = "MIT"
authors = [{ name = "Tyler Jarvis", email = "jarvis@math.byu.edu" }]
keywords = ["rootfinding"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Natural Language :: English",
]
readme = "README.md"
requires-python = ">=3.9"
dependencies = [
    "matplotlib>=3.7",
    "numba>=0.57.0",
    "numpy>=1.21",
    "scipy>=1.10",
]

[project.urls]
Repository = "https://github.com/tylerjarvis/RootFinding"

[dependency-groups]
dev = [
    "pytest>=8.4.0",
]
docs = [
    "sphinx>=7.2",
]

[tool.hatch.build.targets.wheel]
packages = ["yroots"]
