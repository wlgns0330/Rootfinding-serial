name: Unit_Tests
on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5
      with:
        enable-cache: true

    - name: Set up Python
      uses: astral-sh/setup-uv@v5
      with:
        python-version: "3.9"

    - name: Install dependencies
      run: uv sync --frozen

    - name: Test with pytest
      run: uv run pytest tests --ignore=tests/_old_unit_tests
